<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Mendly - Home Dashboard</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            darkMode: "class",

                        "inverse-primary": "#ffb3af",

                        "on-surface-variant": "#5d3f3d",

                        "on-tertiary-container": "#ffe9f0",

                        "tertiary": "#78435c",

                        "surface-bright": "#fcf9ef",
                        "surface-container-high": "#eae8de",
                        "background": "#fcf9ef",
                        "outline": "#926e6c",
                        "coffee-beans": "#4B2E1E",
                        "secondary-container": "#ffd0b9",

                        "surface-container-low": "#f6f4ea",
                        "on-secondary-fixed": "#2d1507",
                        "on-background": "#1b1c16",

                        "primary-fixed": "#ffdad7",

                        "surface-tint": "#bf0022",
                        "on-tertiary-fixed": "#350b22",
                        "on-surface": "#1b1c16",
                        "black-cherry": "#31081F",
                        "primary": "#ac001e",
                        "on-secondary-container": "#7a5745",
                        "secondary": "#795744",
                        "secondary-fixed": "#ffdbca",
                        "surface-container-highest": "#e4e3d9",
                        "secondary-fixed-dim": "#eabda6",
                        "surface": "#fcf9ef",

                        "on-tertiary-fixed-variant": "#69374f",

                    "borderRadius": {

                    "spacing": {

                        "sm": "8px",

                        "gutter": "16px",
                        "base": "4px",
                        "md": "16px",
                        "margin-desktop": "32px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "button": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["34px", { "lineHeight": "41px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-sm": ["17px", { "lineHeight": "22px", "fontWeight": "600" }],
                        "body-lg": ["17px", { "lineHeight": "22px", "fontWeight": "400" }],

                        "button": ["17px", { "lineHeight": "22px", "fontWeight": "600" }]

                }

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
    </style>
</head>
<body class="bg-alabaster-grey text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-racing-red selection:text-white">
<!-- TopAppBar -->
<header class="bg-surface/80 backdrop-blur-xl fixed top-0 w-full z-50 border-b border-coffee-beans/5 shadow-sm flex items-center justify-between px-margin-mobile h-14">
<!-- Leading: Avatar -->
<button class="w-8 h-8 rounded-full overflow-hidden border border-coffee-beans/10 hover:opacity-80 transition-opacity active:scale-95">
<img alt="User Profile Picture" class="w-full h-full object-cover" data-alt="A close-up, modern portrait of a university student smiling warmly, shot with a shallow depth of field in a brightly lit campus environment, reflecting an organized and approachable aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAOBJvP0otug-nh22jADiTU0X0lHvaWBBiejdbDJys3QX_3ZkZP_YZrmX-2R_LQL3TOItOKZfr88JWnRpI8t_ip0JBTJ2mhQ1j9en8VJNzbJWGG2xmTvUVcAKRebhfWK6D7TTBdjeRK4oX4hi8rkwNX43h1OcH49dpTxQcKKAGMSA36j3G0Qt2ZMpNvVh2VrX2Et2GcwNR8Unf-VI_7V79lhIPDBKohqgqeci5bxYIPxBbm8OXHNtcU">
</button>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md font-bold text-racing-red">Mendly</h1>
<!-- Trailing: Icon -->
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center w-10 h-10 -mr-2">
<span class="material-symbols-outlined" data-icon="notifications" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[80px] pb-[100px] px-margin-mobile flex flex-col gap-lg max-w-md mx-auto w-full">
<!-- Profile Action Section -->
<section class="w-full flex flex-col items-center animate-fade-in-up">
<button class="w-full bg-surface border border-coffee-beans/10 rounded-xl py-4 px-6 flex items-center justify-between shadow-[0_4px_24px_rgba(75,46,30,0.03)] hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">person_add</span>
</div>
<div class="text-left">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Setup Profile</h2>
<p class="font-body-sm text-body-sm text-secondary">Upload a photo to be recognized</p>
</div>
</div>
<span class="font-button text-button text-racing-red">Skip</span>
</button>
</section>
<!-- Bento Grid Dashboard -->
<section class="w-full">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-4 pl-1">Quick Access</h2>
<div class="grid grid-cols-2 gap-4">
<!-- Widget: Hostel Services -->
<button class="bg-surface rounded-xl p-5 shadow-[0_8px_24px_rgba(75,46,30,0.04)] border border-coffee-beans/5 flex flex-col items-start justify-between aspect-square hover:shadow-[0_12px_32px_rgba(75,46,30,0.08)] transition-all active:scale-95 group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-surface to-surface-container-low opacity-50"></div>
<div class="w-12 h-12 rounded-full bg-surface-variant/50 flex items-center justify-center text-racing-red mb-auto z-10 group-hover:bg-racing-red/10 transition-colors">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">apartment</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface text-left z-10 leading-tight">Hostel<br>Services</span>
</button>
<!-- Widget: Mess QR -->
<button class="bg-surface rounded-xl p-5 shadow-[0_8px_24px_rgba(75,46,30,0.04)] border border-coffee-beans/5 flex flex-col items-start justify-between aspect-square hover:shadow-[0_12px_32px_rgba(75,46,30,0.08)] transition-all active:scale-95 group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-surface to-surface-container-low opacity-50"></div>
<div class="w-12 h-12 rounded-full bg-surface-variant/50 flex items-center justify-center text-racing-red mb-auto z-10 group-hover:bg-racing-red/10 transition-colors">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface text-left z-10 leading-tight">Mess<br>QR</span>
</button>
<!-- Widget: Shuttle Booking -->
<button class="bg-surface rounded-xl p-5 shadow-[0_8px_24px_rgba(75,46,30,0.04)] border border-coffee-beans/5 flex flex-col items-start justify-between aspect-square hover:shadow-[0_12px_32px_rgba(75,46,30,0.08)] transition-all active:scale-95 group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-surface to-surface-container-low opacity-50"></div>
<div class="w-12 h-12 rounded-full bg-surface-variant/50 flex items-center justify-center text-racing-red mb-auto z-10 group-hover:bg-racing-red/10 transition-colors">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface text-left z-10 leading-tight">Shuttle<br>Booking</span>
</button>
<!-- Widget: Campus Map -->
<button class="bg-surface rounded-xl p-5 shadow-[0_8px_24px_rgba(75,46,30,0.04)] border border-coffee-beans/5 flex flex-col items-start justify-between aspect-square hover:shadow-[0_12px_32px_rgba(75,46,30,0.08)] transition-all active:scale-95 group relative overflow-hidden">
<!-- Subtle background map hint -->
<div class="absolute inset-0 opacity-20 bg-cover bg-center" data-alt="A highly stylized, minimalist vector rendering of a modern university campus map, using very light grey and subtle warm tones to match an iOS aesthetic, clean lines and organized layout." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDmwBvWEpJCFgJGqQ0jXVJ-S-tnt21T22B9G4dsqrgx7zQ5_bIRYcWukl9wSPVl0NWpAQE0qis0xnm21yvbRDbCeqcEVaK_hVOMA7Eo7JIadn7wZXQniCpHmBke3q0-YVK23A1RB-ZJMY-RTe1i6h2BbF_CZs9EQl1jyc-bJ1PF7Ky4SHkQw_F7EGRQLDiqFPWcYQA-A9ddKfE_1xDyE_P_uORSnIHKzZ1ub3N6oBSC1KvjLBXSIp5u')"></div>
<div class="w-12 h-12 rounded-full bg-surface/80 backdrop-blur-sm flex items-center justify-center text-racing-red mb-auto z-10 border border-surface-variant">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">map</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface text-left z-10 leading-tight">Campus<br>Map</span>
</button>
</div>
</section>
<!-- Primary Action -->
<section class="w-full mt-auto pt-6">
<button class="w-full h-[56px] bg-racing-red text-white rounded-full font-button text-button shadow-[0_8px_24px_rgba(217,4,41,0.3)] hover:bg-surface-tint active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
                Generate Day Pass
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface/80 backdrop-blur-xl fixed bottom-0 w-full z-50 pb-safe border-t border-coffee-beans/5 shadow-none flex justify-around items-center h-16 px-4">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center text-racing-red active:scale-90 transition-transform duration-200 w-16 h-full gap-1">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</button>
<!-- Maintenance (Inactive) -->
<button class="flex flex-col items-center justify-center text-secondary opacity-60 hover:opacity-100 transition-all active:scale-90 duration-200 w-16 h-full gap-1">
<span class="material-symbols-outlined" data-icon="build" style="font-variation-settings: 'FILL' 0;">build</span>
<span class="font-label-caps text-label-caps">Maintenance</span>
</button>
<!-- Mess (Inactive) -->
<button class="flex flex-col items-center justify-center text-secondary opacity-60 hover:opacity-100 transition-all active:scale-90 duration-200 w-16 h-full gap-1">
<span class="material-symbols-outlined" data-icon="restaurant" style="font-variation-settings: 'FILL' 0;">restaurant</span>
<span class="font-label-caps text-label-caps">Mess</span>
</button>
<!-- Shuttle (Inactive) -->
<button class="flex flex-col items-center justify-center text-secondary opacity-60 hover:opacity-100 transition-all active:scale-90 duration-200 w-16 h-full gap-1">
<span class="material-symbols-outlined" data-icon="local_shipping" style="font-variation-settings: 'FILL' 0;">local_shipping</span>
<span class="font-label-caps text-label-caps">Shuttle</span>
</button>
</nav>
<style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
    </style>
</body></html>
