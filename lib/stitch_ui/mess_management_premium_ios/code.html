<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* iOS style inner shadow for form fields */
        .ios-input-shadow {
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
        }

<body class="bg-alabaster-grey text-on-surface antialiased min-h-screen flex flex-col pt-14 pb-16 md:pb-0 md:pt-14">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-black-cherry/80 backdrop-blur-xl border-b border-coffee-beans/5 shadow-sm flex items-center justify-between px-margin-mobile h-14 transition-all">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container border border-coffee-beans/10 shrink-0">
<img alt="user profile picture" class="w-full h-full object-cover" data-alt="A close up, high quality headshot portrait of a college student smiling naturally. Clean, bright corporate lighting on a light background. iOS app avatar style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDggDPHgczQdSeFSyNz2tb97-aYwoas4Rxncy4zK94N-Tip210GvmUFjFctOnw9Yk9u6_eScLW_PjAjM7G4iqCLLLKgK-MSFljWKC8mZCqn_HXBjmZ6jnSsZOvfFrUncCo8NW3wukkpdMile-V2k1vNLHSBz2FVwhmroOZQU6shwR4aGvyl-ZGo6Akj6ZShiHtuxL9dJx3Isi26UeS8TYequJKxb8V3_NMbk1_YLYr6QTFyA_ENDGRZ">
</div>
<span class="font-headline-md text-headline-md font-bold text-racing-red dark:text-primary-fixed-dim">Mendly</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:opacity-80 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop pt-lg pb-xl space-y-xl">
<!-- Page Title -->
<div class="space-y-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Mess Entry</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Scan at the entrance for your daily meal.</p>
</div>
<!-- Hero QR Code Card (Bento Grid Style) -->
<div class="bg-surface-container-lowest rounded-xl border border-coffee-beans/10 shadow-ambient p-lg flex flex-col items-center justify-center space-y-lg max-w-sm mx-auto w-full">
<div class="text-center space-y-base w-full">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Dinner Pass</h2>
<div class="inline-flex items-center gap-xs px-sm py-1 rounded-full bg-secondary-fixed text-on-secondary-fixed-variant font-label-caps text-label-caps">
<span class="w-2 h-2 rounded-full bg-racing-red"></span>
                    Active Now
                </div>
</div>
<!-- QR Code Placeholder Container -->
<div class="w-64 h-64 bg-surface rounded-lg border border-coffee-beans/5 flex items-center justify-center p-sm relative overflow-hidden group">
<img alt="QR Code" class="w-full h-full object-contain mix-blend-multiply" data-alt="A clean, high-contrast, black and white scannable QR code graphic centered perfectly in a square frame. Minimalist and functional style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8oZXJfdsyyKI9yRwhvqHhHl5QTQ7z1ywmrYl3INoipTeDtHRNlL6UC0_xNNwLSMLU6dK74afpO0oOToZeqp9xF7NizpNPO0fcHed1sV8Bk_SC176RqpCYKMAh_1zp10m7MPV_nfrEQSA3fMrE_See6SeQS73tJIE0JiViNjjjFe-7Ih118HaqctWXVbDiBMnEthZx1RaVOcWsF5cgHDa7uddF1jVY1CcxjNpI1-0lATaalfilEpJ4">
<!-- Scanning animation overlay -->
<div class="absolute inset-0 bg-gradient-to-b from-transparent via-racing-red/20 to-transparent h-1/2 w-full animate-[scan_2s_ease-in-out_infinite] pointer-events-none"></div>
</div>
<div class="text-center w-full">
<p class="font-body-sm text-body-sm text-on-surface-variant">ID: 104-MND-892</p>
<p class="font-label-caps text-label-caps text-secondary mt-xs">Auto-refreshes in 04:59</p>
</div>
</div>
<hr class="border-coffee-beans/5 w-1/2 mx-auto">
<!-- Mess Complaints Form (iOS HIG Native Feel) -->
<section class="max-w-md mx-auto w-full space-y-md">
<div class="flex items-center gap-sm px-base">
<span class="material-symbols-outlined text-secondary" data-icon="campaign">campaign</span>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Mess Feedback &amp; Complaints</h3>
</div>
<form class="space-y-md bg-surface-container-lowest rounded-xl border border-coffee-beans/10 shadow-ambient p-md">
<!-- Category Select -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant block px-xs">Category</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-low border-0 text-on-surface font-body-md text-body-md rounded-lg py-3 px-4 ios-input-shadow focus:ring-2 focus:ring-racing-red focus:bg-surface-container-lowest transition-colors">
<option>Food Quality</option>
<option>Hygiene</option>
<option>Staff Behavior</option>
<option>Menu Suggestion</option>
<option>Other</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Text Area -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant block px-xs">Details</label>
<textarea class="w-full bg-surface-container-low border-0 text-on-surface font-body-md text-body-md rounded-lg py-3 px-4 ios-input-shadow focus:ring-2 focus:ring-racing-red focus:bg-surface-container-lowest transition-colors resize-none" placeholder="Describe the issue..." rows="4"></textarea>
</div>
<!-- Action Button -->
<button class="w-full h-[50px] bg-racing-red text-white font-button text-button rounded-lg flex items-center justify-center gap-sm hover:opacity-90 active:scale-95 transition-all shadow-sm" type="button">
<span class="material-symbols-outlined fill" data-icon="send">send</span>
                    Submit Feedback
                </button>
</form>
</section>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 pb-safe bg-surface/80 dark:bg-black-cherry/80 backdrop-blur-xl border-t border-coffee-beans/5 shadow-none flex justify-around items-center h-16 px-4">
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim opacity-60 hover:opacity-100 active:scale-90 transition-all duration-200 group w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim opacity-60 hover:opacity-100 active:scale-90 transition-all duration-200 group w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="build">build</span>
<span class="font-label-caps text-label-caps">Maintenance</span>
</a>
<!-- Active Tab -->
<a class="flex flex-col items-center justify-center text-racing-red dark:text-primary-fixed-dim hover:opacity-100 active:scale-90 transition-all duration-200 group w-16" href="#">
<span class="material-symbols-outlined fill mb-1" data-icon="restaurant">restaurant</span>
<span class="font-label-caps text-label-caps">Mess</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim opacity-60 hover:opacity-100 active:scale-90 transition-all duration-200 group w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="local_shipping">local_shipping</span>
<span class="font-label-caps text-label-caps">Shuttle</span>
</a>
</nav>
<style>
        @keyframes scan {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }
    </style>
</body></html>
