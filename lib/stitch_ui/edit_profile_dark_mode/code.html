<body class="bg-black-cherry text-on-surface antialiased min-h-screen flex flex-col pt-14 pb-16 md:pb-0 md:pt-14 mb-xl">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-coffee-beans/70 backdrop-blur-xl border-b border-alabaster-grey/15 shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] flex items-center justify-between px-margin-mobile h-14 transition-all">

<span class="material-symbols-outlined" data-icon="arrow_back_ios">arrow_back_ios</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-alabaster-grey absolute left-1/2 -translate-x-1/2">Edit Profile</h1>
<button class="text-racing-red font-button hover:opacity-70 transition-opacity active:scale-95 transition-transform">
            Save
        </button>
</header>
<!-- Main Content Canvas -->
<main class="px-margin-mobile pt-lg max-w-lg mx-auto">
<!-- Profile Picture Section -->
<div class="flex flex-col items-center justify-center mb-xl">
<div class="relative w-24 h-24 mb-sm">
<img class="w-full h-full rounded-full object-cover shadow-[0_8px_24px_rgba(0,0,0,0.5)] border-2 border-white/10" data-alt="A premium, studio-quality portrait of a college student in a brightly lit modern academic setting. The student is smiling warmly, dressed in smart casual attire. The background is slightly blurred featuring clean architectural lines and natural daylight. The image has a light, optimistic mood, perfect for a professional academic profile, utilizing subtle warm tones that complement the overall light mode corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBme5Ln9bHnwaP4tZgfdfGyM2ZyR2t85DU0_QnyjI660pi478ykTX44PntnIkZ_gHkZZWCi5Y3UteP1wezul27ERYgaAuI1nC2IfbZegg038q58kyYUDHu8d0bbD5bo0Su4Fq4hhCJH3xYjIy_Ej-ix3sB-uaQE9PlAJoUSOgBiDYDyucY6ZxKHWWABI0JXNy0sF_xh_8-tKY8Zsye003pXlN69VUIdbMq4_CiA56irYMPspn5Fsqux">
<button class="absolute bottom-0 right-0 bg-surface-container-low rounded-full w-8 h-8 flex items-center justify-center shadow-md border border-alabaster-grey/15 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px] text-alabaster-grey" data-icon="photo_camera">photo_camera</span>
</button>
</div>
<button class="font-button text-button text-racing-red hover:opacity-70 transition-opacity">Edit Picture</button>
</div>
<!-- Input Fields - Inward Inset List Style -->
<section class="rounded-xl shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] border-[0.5px] border-alabaster-grey/15 overflow-hidden mb-xl bg-black-cherry"><!-- Full Name -->
<div class="relative px-md py-sm border-b border-white/10 ml-md pl-0 flex flex-col justify-center min-h-[60px]">
<label class="font-body-sm text-body-sm text-alabaster-grey/70 mb-xs" for="fullName">Full Name</label>
<input class="w-full bg-transparent border-none p-0 m-0 font-body-lg text-body-lg text-alabaster-grey focus:ring-0 focus:outline-none" id="fullName" type="text" value="Sarah Jenkins">
</div>
<!-- University ID -->
<div class="relative px-md py-sm border-b border-white/10 ml-md pl-0 flex flex-col justify-center min-h-[60px]">
<label class="font-body-sm text-body-sm text-alabaster-grey/70 mb-xs" for="uniId">University ID</label>
<input class="w-full bg-transparent border-none p-0 m-0 font-body-lg text-body-lg focus:ring-0 focus:outline-none text-alabaster-grey/50" id="uniId" readonly="" type="text" value="U8923412">
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-alabaster-grey/50 text-[20px]" data-icon="lock">lock</span>
</div>
<!-- Email Address -->
<div class="relative px-md py-sm border-b border-white/10 ml-md pl-0 flex flex-col justify-center min-h-[60px]">
<label class="font-body-sm text-body-sm text-alabaster-grey/70 mb-xs" for="email">Email Address</label>
<input class="w-full bg-transparent border-none p-0 m-0 font-body-lg text-body-lg text-alabaster-grey focus:ring-0 focus:outline-none" id="email" type="email" value="s.jenkins@university.edu">
</div>
<!-- Phone Number -->
<div class="relative px-md py-sm ml-md pl-0 flex flex-col justify-center min-h-[60px]">
<label class="font-body-sm text-body-sm text-alabaster-grey/70 mb-xs" for="phone">Phone Number</label>
<input class="w-full bg-transparent border-none p-0 m-0 font-body-lg text-body-lg text-alabaster-grey focus:ring-0 focus:outline-none" id="phone" type="tel" value="(555) 123-4567">
</div></section>
<!-- Actions -->
<section class="flex flex-col gap-md">
<button class="w-full h-[50px] bg-black-cherry rounded-lg border border-alabaster-grey/15 font-button text-button text-racing-red flex items-center justify-center hover:opacity-80 active:scale-[0.98] transition-all" style="font-family: &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;">Change Password</button>
<button class="w-full h-[50px] bg-black-cherry rounded-lg border border-alabaster-grey/15 font-button text-button flex items-center justify-center hover:opacity-80 active:scale-[0.98] transition-all text-racing-red">
                Sign Out
            </button>
</section>
