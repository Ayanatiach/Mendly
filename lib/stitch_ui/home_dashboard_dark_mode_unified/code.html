<!DOCTYPE html><html class="dark" lang="en"><head>

                        "body-md": ["Inter"],

<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-black-cherry text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-racing-red selection:text-white">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-coffee-beans/70 backdrop-blur-xl border-b border-alabaster-grey/15 shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] flex items-center justify-between px-margin-mobile h-14 transition-all">
<!-- Leading: Avatar -->
<div class="flex items-center gap-sm">
<button class="w-8 h-8 rounded-full overflow-hidden bg-surface-container border border-alabaster-grey/10 shrink-0 hover:opacity-80 transition-opacity active:scale-95">
<img alt="User Profile Picture" class="w-full h-full object-cover" data-alt="A close-up, modern portrait of a university student smiling warmly, shot with a shallow depth of field in a brightly lit campus environment, reflecting an organized and approachable aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAOBJvP0otug-nh22jADiTU0X0lHvaWBBiejdbDJys3QX_3ZkZP_YZrmX-2R_LQL3TOItOKZfr88JWnRpI8t_ip0JBTJ2mhQ1j9en8VJNzbJWGG2xmTvUVcAKRebhfWK6D7TTBdjeRK4oX4hi8rkwNX43h1OcH49dpTxQcKKAGMSA36j3G0Qt2ZMpNvVh2VrX2Et2GcwNR8Unf-VI_7V79lhIPDBKohqgqeci5bxYIPxBbm8OXHNtcU">
</button>
<!-- Headline -->
<span class="font-headline-md text-headline-md font-bold text-racing-red">Mendly</span>
</div>
<!-- Trailing: Icon -->
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:opacity-80 active:scale-95 transition-all -mr-2">
<span class="material-symbols-outlined" data-icon="notifications" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[80px] pb-[100px] px-margin-mobile flex flex-col gap-lg max-w-md mx-auto w-full">
<!-- Profile Action Section -->
<section class="w-full flex flex-col items-center animate-fade-in-up">
<button class="w-full bg-coffee-beans/70 backdrop-blur-[20px] border-[0.5px] border-alabaster-grey/15 rounded-xl py-4 px-6 flex items-center justify-between shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] hover:bg-white/5 transition-colors active:scale-[0.98]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">person_add</span>
</div>
<div class="text-left">
<h2 class="font-headline-sm text-headline-sm text-alabaster-grey">Setup Profile</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Upload a photo to be recognized</p>
</div>
</div>
<span class="font-button text-button text-racing-red">Skip</span>
</button>
</section>
<!-- Bento Grid Dashboard -->
<section class="w-full">
<h2 class="font-headline-sm text-headline-sm text-alabaster-grey mb-4 pl-1">Quick Access</h2>
<div class="grid grid-cols-2 gap-4">
<!-- Widget: Hostel Services -->
<button class="bg-coffee-beans/70 backdrop-blur-[20px] rounded-xl p-5 shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] border-[0.5px] border-alabaster-grey/15 flex flex-col items-start justify-between aspect-square hover:bg-white/5 hover:border-racing-red/30 transition-all active:scale-95 group relative overflow-hidden">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-racing-red mb-auto z-10 group-hover:bg-racing-red/20 transition-colors border border-alabaster-grey/10 group-hover:border-racing-red/30">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">apartment</span>
</div>
<span class="font-headline-sm text-headline-sm text-alabaster-grey text-left z-10 leading-tight">Hostel<br>Services</span>
</button>
<!-- Widget: Mess QR -->
<button class="bg-coffee-beans/70 backdrop-blur-[20px] rounded-xl p-5 shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] border-[0.5px] border-alabaster-grey/15 flex flex-col items-start justify-between aspect-square hover:bg-white/5 hover:border-racing-red/30 transition-all active:scale-95 group relative overflow-hidden">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-racing-red mb-auto z-10 group-hover:bg-racing-red/20 transition-colors border border-alabaster-grey/10 group-hover:border-racing-red/30">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
</div>
<span class="font-headline-sm text-headline-sm text-alabaster-grey text-left z-10 leading-tight">Mess<br>QR</span>
</button>
<!-- Widget: Shuttle Booking -->
<button class="bg-coffee-beans/70 backdrop-blur-[20px] rounded-xl p-5 shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] border-[0.5px] border-alabaster-grey/15 flex flex-col items-start justify-between aspect-square hover:bg-white/5 hover:border-racing-red/30 transition-all active:scale-95 group relative overflow-hidden">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-racing-red mb-auto z-10 group-hover:bg-racing-red/20 transition-colors border border-alabaster-grey/10 group-hover:border-racing-red/30">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
</div>
<span class="font-headline-sm text-headline-sm text-alabaster-grey text-left z-10 leading-tight">Shuttle<br>Booking</span>
</button>
<!-- Widget: Campus Map -->
<button class="bg-coffee-beans/70 backdrop-blur-[20px] rounded-xl p-5 shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] border-[0.5px] border-alabaster-grey/15 flex flex-col items-start justify-between aspect-square hover:bg-white/5 hover:border-racing-red/30 transition-all active:scale-95 group relative overflow-hidden">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-racing-red mb-auto z-10 group-hover:bg-racing-red/20 transition-colors border border-alabaster-grey/10 group-hover:border-racing-red/30">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">map</span>
</div>
<span class="font-headline-sm text-headline-sm text-alabaster-grey text-left z-10 leading-tight">Campus<br>Map</span>
</button>
</div>
</section>
<!-- Primary Action -->
<section class="w-full mt-auto pt-6">
<button class="w-full h-[56px] bg-gradient-to-b from-[#D90429] to-[#bf0022] text-alabaster-grey rounded-full font-button text-button shadow-[0_4px_12px_rgba(217,4,41,0.3)] hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
                Generate Day Pass
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 w-full z-50 pb-safe bg-black-cherry/90 backdrop-blur-xl border-t border-alabaster-grey/15 shadow-none flex justify-around items-center h-16 px-4">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center text-racing-red hover:opacity-100 active:scale-90 transition-all duration-200 group w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<!-- Maintenance (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:opacity-100 active:scale-90 transition-all duration-200 group w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="build">build</span>
<span class="font-label-caps text-label-caps">Maintenance</span>
</a>
<!-- Mess (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:opacity-100 active:scale-90 transition-all duration-200 group w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="restaurant">restaurant</span>
<span class="font-label-caps text-label-caps">Mess</span>
</a>
<!-- Shuttle (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:opacity-100 active:scale-90 transition-all duration-200 group w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="local_shipping">local_shipping</span>
<span class="font-label-caps text-label-caps">Shuttle</span>
</a>
</nav>
</body></html>
