<body class="bg-alabaster-grey min-h-screen flex flex-col items-center justify-center p-margin-mobile antialiased text-coffee-beans">
<!-- Login Container -->
<main class="w-full max-w-md flex flex-col gap-lg">
<!-- Header Section -->
<header class="flex flex-col items-center text-center gap-sm mb-md">
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg text-racing-red tracking-tight">Mendly</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Sign in to continue to your&nbsp;<br>dashboard.</p>
</header>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-sm" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant/60">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-[14px] pl-[44px] pr-md text-coffee-beans font-body-lg text-body-lg placeholder:text-outline/60 focus:outline-none focus:border-racing-red focus:ring-1 focus:ring-racing-red transition-all duration-300 shadow-sm" id="email" placeholder="name@university.edu" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-sm" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant/60">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-[14px] pl-[44px] pr-md text-coffee-beans font-body-lg text-body-lg placeholder:text-outline/60 focus:outline-none focus:border-racing-red focus:ring-1 focus:ring-racing-red transition-all duration-300 shadow-sm" id="password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-[-8px]">
<a class="font-body-sm text-body-sm text-racing-red hover:text-primary transition-colors font-medium" href="#">Forgot Password?</a>
</div>
<!-- Primary Action -->
<button class="w-full bg-gradient-to-b from-racing-red to-[#B00320] text-on-error font-button text-button py-[14px] rounded-xl shadow-[0_4px_16px_rgba(189,0,0,0.25)] hover:shadow-[0_6px_20px_rgba(189,0,0,0.35)] active:scale-[0.98] transition-all duration-200 mt-sm flex items-center justify-center gap-sm group" type="submit">
                Sign In
                <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md my-xs">
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant/60 uppercase">Or continue with</span>
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-sm">
<button class="w-full bg-surface-container-lowest border border-outline-variant text-coffee-beans font-button text-button py-[12px] rounded-xl hover:bg-surface-container-low transition-colors flex items-center justify-center gap-sm active:scale-[0.98] shadow-sm">
<span class="material-symbols-outlined text-[20px]">school</span>
                Campus SSO
            </button>
<button class="w-full bg-surface-container-lowest border border-outline-variant text-coffee-beans font-button text-button py-[12px] rounded-xl hover:bg-surface-container-low transition-colors flex items-center justify-center gap-sm active:scale-[0.98] shadow-sm">
<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Google
            </button>
</div>
<!-- Footer -->
<div class="text-center mt-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">Don't have an account? <a class="text-racing-red font-semibold hover:underline" href="#">Sign up</a></p>
</div>
