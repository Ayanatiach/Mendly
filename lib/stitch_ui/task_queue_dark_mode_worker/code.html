<style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #13140e;
        }
        .glass-panel {
            background-color: rgba(26, 13, 8, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid rgba(242, 240, 230, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface antialiased min-h-screen pb-safe">
<!-- Top Navigation (Glassmorphic) -->
<header class="fixed top-0 w-full z-50 glass-panel shadow-sm">
<div class="flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 w-full">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-highest overflow-hidden border border-outline-variant/30 flex items-center justify-center">
<img alt="Rajesh Kumar" class="w-full h-full object-cover" data-alt="A close up, high quality headshot portrait of a maintenance worker named Rajesh. He is wearing a dark, utilitarian uniform. The lighting is moody and dramatic with a subtle crimson rim light, fitting a high-end dark mode aesthetic. The background is a blurred, dark industrial setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEwjVxhRank-GBUIyvNw4fZQ-cOKNNMmpJ6f9LWB7Tqw4JYEuLmARyDk35R0PRvMiLTSwsBRHNNNNUWtAePJwwj-HLeK7t3XnQUlF5LkzaP1WeAUMc_dvGmfJh5hzzp85tUUMBCGsrY-3GLqkZpEZIrNRWFS14gTAn8onN6tLKzU5sZ0SaDrV4aOInhPIRAYLhYjIpb3WmMIYVujGxaiw5vnYhPbgcV_GfYkPFmuljr-dlBM4UZKJN"/>
</div>
<div class="flex flex-col">
<h1 class="text-button font-button text-on-surface">Rajesh Kumar</h1>
<span class="text-label-caps font-label-caps text-on-surface-variant">MORNING SHIFT</span>
</div>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors active:scale-95 duration-100 relative">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">notifications</span>
<span class="absolute top-2 right-2 w-2 h-2 bg-racing-red rounded-full"></span>
</button>
</div>
</header>
<!-- Main Content Area (Inset Grouped Layout) -->
<main class="pt-24 px-margin-mobile md:px-margin-desktop md:max-w-3xl md:mx-auto space-y-xl pb-margin-desktop">
<!-- Active Task Card -->
<section class="space-y-sm">
<h2 class="text-label-caps font-label-caps text-on-surface-variant px-sm">CURRENT TASK</h2>
<div class="glass-panel rounded-xl p-lg space-y-md relative overflow-hidden">
<!-- Red ambient glow -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-racing-red/20 blur-3xl rounded-full pointer-events-none"></div>
<div class="flex justify-between items-start">
<div class="inline-flex items-center gap-2 bg-black-cherry border border-racing-red/50 rounded-full px-3 py-1">
<span class="material-symbols-outlined text-racing-red text-[16px]" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="text-label-caps font-label-caps text-racing-red">EMERGENCY</span>
</div>
</div>
<div>
<h3 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Leaking Faucet</h3>
<div class="flex items-center gap-2 mt-2 text-on-surface-variant text-body-lg font-body-lg">
<span class="material-symbols-outlined text-[20px]">location_on</span>
<span>Room 204, Hostel A</span>
</div>
</div>
<div class="flex flex-col gap-3 pt-sm">
<button class="w-full flex items-center justify-center gap-2 bg-black-cherry border border-alabaster-grey/20 text-on-surface py-3 rounded-lg text-button font-button hover:border-racing-red/50 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined">photo_camera</span>
                        Upload Proof
                    </button>
<div class="flex gap-3">
<button class="flex-1 bg-[#D4AF37]/20 text-[#D4AF37] border border-[#D4AF37]/50 py-3 rounded-lg text-button font-button flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pending</span>
                            In Progress
                        </button>
<button class="flex-1 bg-surface-container-lowest text-on-surface border border-outline-variant py-3 rounded-lg text-button font-button flex items-center justify-center gap-2 opacity-50 cursor-not-allowed">
<span class="material-symbols-outlined">check_circle</span>
                            Resolved
                        </button>
</div>
</div>
</div>
</section>
<!-- Up Next Section -->
<section class="space-y-sm">
<div class="flex justify-between items-center px-sm">
<h2 class="text-label-caps font-label-caps text-on-surface-variant">UP NEXT</h2>
<span class="text-label-caps font-label-caps text-on-surface-variant">3 ITEMS</span>
</div>
<div class="glass-panel rounded-xl overflow-hidden flex flex-col">
<!-- List Item 1 -->
<button class="w-full text-left p-4 flex items-center justify-between border-b border-alabaster-grey/10 hover:bg-surface-container-high transition-colors active:bg-surface-container-highest">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined">carpenter</span>
</div>
<div>
<p class="text-button font-button text-on-surface">Table Repair</p>
<p class="text-body-sm font-body-sm text-on-surface-variant">Mess Hall</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
<!-- List Item 2 -->
<button class="w-full text-left p-4 flex items-center justify-between border-b border-alabaster-grey/10 hover:bg-surface-container-high transition-colors active:bg-surface-container-highest">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined">electric_bolt</span>
</div>
<div>
<p class="text-button font-button text-on-surface">Light Switch Replacement</p>
<p class="text-body-sm font-body-sm text-on-surface-variant">Room 102</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
<!-- List Item 3 -->
<button class="w-full text-left p-4 flex items-center justify-between hover:bg-surface-container-high transition-colors active:bg-surface-container-highest">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined">directions_bus</span>
</div>
<div>
<p class="text-button font-button text-on-surface">Routine Check</p>
<p class="text-body-sm font-body-sm text-on-surface-variant">Shuttle Bus B-12</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</div>
</section>
</main>
</body></html>
